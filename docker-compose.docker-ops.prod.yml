name: dunckops-platform
x-release: ${DUNCKOPS_VERSION:?Set DUNCKOPS_VERSION to an actual published X.Y.Z release; never latest}

services:
  api:
    environment:
      DOCKER_OPERATIONS_ENABLED: "true"
      DOCKER_AGENT_URL: "http://docker-agent:8080"
      DOCKER_AGENT_KEY: ${DOCKER_AGENT_KEY:?DOCKER_AGENT_KEY is required}
    depends_on:
      dunckops-db:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      docker-agent:
        condition: service_started

  docker-agent:
    container_name: dunckops-docker-agent
    image: ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-docker-agent:${DUNCKOPS_VERSION}
    environment:
      PORT: ${DOCKER_AGENT_CONTAINER_PORT:-8080}
      ASPNETCORE_ENVIRONMENT: Production
      DUNCKOPS_VERSION: ${DUNCKOPS_VERSION}
      AGENT_KEY: ${DOCKER_AGENT_KEY:?DOCKER_AGENT_KEY is required}
      DOCKER_ALLOW_ANY_CONTAINER: ${DOCKER_ALLOW_ANY_CONTAINER:-false}
      POSTGRES_RUNTIME_IMAGE_PREFIX: ${POSTGRES_RUNTIME_IMAGE_PREFIX:-dunckops-postgres-runtime}
      BACKUP_RUNTIME_IMAGE: ${BACKUP_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-backup-runtime:${DUNCKOPS_VERSION}}
      PHYSICAL_SNAPSHOTS_ENABLED: ${PHYSICAL_SNAPSHOTS_ENABLED:-false}
      PHYSICAL_SNAPSHOT_TIMEOUT_MINUTES: ${PHYSICAL_SNAPSHOT_TIMEOUT_MINUTES:-60}
      MULTI_ENGINE_OPERATIONS_ENABLED: ${MULTI_ENGINE_OPERATIONS_ENABLED:-false}
      ENGINE_ARTIFACTS_RUNTIME_IMAGE: ${ENGINE_ARTIFACTS_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-engine-artifacts-runtime:${DUNCKOPS_VERSION}}
      ENGINE_PROVISIONING_BIND_ADDRESS: ${ENGINE_PROVISIONING_BIND_ADDRESS:-127.0.0.1}
      ENGINE_PROVISIONING_ALLOW_IMAGE_PULL: ${ENGINE_PROVISIONING_ALLOW_IMAGE_PULL:-true}
      ENGINE_COPY_RUNTIME_IMAGE_PREFIX: ${ENGINE_COPY_RUNTIME_IMAGE_PREFIX:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-engine-copy-runtime}
      ENGINE_COPY_RUNTIME_VERSION: ${ENGINE_COPY_RUNTIME_VERSION:-${DUNCKOPS_VERSION}}
      ENGINE_PROVISIONING_NETWORK: ${ENGINE_PROVISIONING_NETWORK:-${BACKUP_RUNTIME_NETWORK:-dunckops-platform_default}}
      SQLSERVER_PROVISIONING_ENCRYPT: ${SQLSERVER_PROVISIONING_ENCRYPT:-true}
      SQLSERVER_PROVISIONING_TRUST_SERVER_CERTIFICATE: ${SQLSERVER_PROVISIONING_TRUST_SERVER_CERTIFICATE:-false}
      SQLSERVER_OPERATIONS_UNVERIFIED_OPT_IN: ${SQLSERVER_OPERATIONS_UNVERIFIED_OPT_IN:-false}
      SQLSERVER_MANAGED_SETUP_ENABLED: ${SQLSERVER_MANAGED_SETUP_ENABLED:-false}
      SQLSERVER_RUNTIME_APPROVAL_PAYLOAD: ${SQLSERVER_RUNTIME_APPROVAL_PAYLOAD:-}
      SQLSERVER_RUNTIME_APPROVAL_SIGNATURE: ${SQLSERVER_RUNTIME_APPROVAL_SIGNATURE:-}
      SQLSERVER_RUNTIME_APPROVAL_PUBLIC_KEY: ${SQLSERVER_RUNTIME_APPROVAL_PUBLIC_KEY:-}
      SQLSERVER_RUNTIME_APPROVAL_PUBLIC_KEY_SHA256: ${SQLSERVER_RUNTIME_APPROVAL_PUBLIC_KEY_SHA256:-}
      MYSQL_OPERATIONS_RUNTIME_IMAGE: ${MYSQL_OPERATIONS_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-mysql-operations-runtime:${DUNCKOPS_VERSION}}
      MARIADB_OPERATIONS_RUNTIME_IMAGE: ${MARIADB_OPERATIONS_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-mariadb-operations-runtime:${DUNCKOPS_VERSION}}
      MONGO_OPERATIONS_RUNTIME_IMAGE: ${MONGO_OPERATIONS_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-mongo-operations-runtime:${DUNCKOPS_VERSION}}
      MYSQL_RESTORE_SERVER_IMAGE: ${MYSQL_RESTORE_SERVER_IMAGE:-mysql:8.4.11}
      MARIADB_RESTORE_SERVER_IMAGE: ${MARIADB_RESTORE_SERVER_IMAGE:-mariadb:11.4.13}
      SQLSERVER_OPERATIONS_RUNTIME_IMAGE: ${SQLSERVER_OPERATIONS_RUNTIME_IMAGE:-}
      SQLSERVER_OPERATIONS_BACKUP_VOLUME: ${SQLSERVER_OPERATIONS_BACKUP_VOLUME:-}
      SQLSERVER_OPERATIONS_SIGNING_VOLUME: ${SQLSERVER_OPERATIONS_SIGNING_VOLUME:-}
      SQLSERVER_OPERATIONS_SIGNING_PUBLIC_KEY_SHA256: ${SQLSERVER_OPERATIONS_SIGNING_PUBLIC_KEY_SHA256:-}
      SQLSERVER_OPERATIONS_TIMEOUT_SECONDS: ${SQLSERVER_OPERATIONS_TIMEOUT_SECONDS:-1800}
      MYSQL_SNAPSHOT_RUNTIME_IMAGE: ${MYSQL_SNAPSHOT_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-mysql-snapshot-runtime:${DUNCKOPS_VERSION}}
      MARIADB_SNAPSHOT_RUNTIME_IMAGE: ${MARIADB_SNAPSHOT_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-mariadb-snapshot-runtime:${DUNCKOPS_VERSION}}
      BACKUP_RUNTIME_NETWORK: ${BACKUP_RUNTIME_NETWORK:-dunckops-platform_default}
      DUNCKOPS_LOCAL_BACKUP_VOLUME: ${DUNCKOPS_LOCAL_BACKUP_VOLUME:-dunckops-local-backups}
      BACKUP_RUNTIME_TIMEOUT_MINUTES: ${BACKUP_RUNTIME_TIMEOUT_MINUTES:-720}
      POSTGRES_CLONE_READY_TIMEOUT_MINUTES: ${POSTGRES_CLONE_READY_TIMEOUT_MINUTES:-120}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      dunckops.managed: "true"
    restart: unless-stopped

  backup-runtime:
    container_name: dunckops-backup-runtime
    image: ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-backup-runtime:${DUNCKOPS_VERSION}
    profiles:
      - tools
    labels:
      dunckops.managed: "true"

  mysql-snapshot-runtime:
    # Tool images are downloaded only with their explicit feature opt-in.
    image: ${MYSQL_SNAPSHOT_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-mysql-snapshot-runtime:${DUNCKOPS_VERSION}}
    profiles: [tools]

  mariadb-snapshot-runtime:
    image: ${MARIADB_SNAPSHOT_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-mariadb-snapshot-runtime:${DUNCKOPS_VERSION}}
    profiles: [tools]

  mysql-operations-runtime:
    image: ${MYSQL_OPERATIONS_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-mysql-operations-runtime:${DUNCKOPS_VERSION}}
    profiles: [tools]

  mariadb-operations-runtime:
    image: ${MARIADB_OPERATIONS_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-mariadb-operations-runtime:${DUNCKOPS_VERSION}}
    profiles: [tools]

  mongo-operations-runtime:
    image: ${MONGO_OPERATIONS_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-mongo-operations-runtime:${DUNCKOPS_VERSION}}
    profiles: [tools]

  sqlserver-operations-runtime:
    # Client tools only; never use this registry tag as the agent runtime ID.
    image: ${SQLSERVER_OPERATIONS_CLIENT_TOOLS_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-sqlserver-operations-runtime:${DUNCKOPS_VERSION}}
    profiles: [tools]

  mysql-restore-server:
    image: ${MYSQL_RESTORE_SERVER_IMAGE:-mysql:8.4.11}
    entrypoint: ["true"]
    profiles: [tools]

  mariadb-restore-server:
    image: ${MARIADB_RESTORE_SERVER_IMAGE:-mariadb:11.4.13}
    entrypoint: ["true"]
    profiles: [tools]

  engine-artifacts-runtime:
    image: ${ENGINE_ARTIFACTS_RUNTIME_IMAGE:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-engine-artifacts-runtime:${DUNCKOPS_VERSION}}
    profiles: [tools]

  engine-copy-mysql-8-0:
    image: ${ENGINE_COPY_RUNTIME_IMAGE_PREFIX:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-engine-copy-runtime}:mysql-8.0-${ENGINE_COPY_RUNTIME_VERSION:-${DUNCKOPS_VERSION}}
    profiles: [tools]

  engine-copy-mysql-8-4:
    image: ${ENGINE_COPY_RUNTIME_IMAGE_PREFIX:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-engine-copy-runtime}:mysql-8.4-${ENGINE_COPY_RUNTIME_VERSION:-${DUNCKOPS_VERSION}}
    profiles: [tools]

  engine-copy-mariadb-10-11:
    image: ${ENGINE_COPY_RUNTIME_IMAGE_PREFIX:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-engine-copy-runtime}:mariadb-10.11-${ENGINE_COPY_RUNTIME_VERSION:-${DUNCKOPS_VERSION}}
    profiles: [tools]

  engine-copy-mariadb-11-4:
    image: ${ENGINE_COPY_RUNTIME_IMAGE_PREFIX:-ghcr.io/${REGISTRY_OWNER:-dunck01}/dunckops-engine-copy-runtime}:mariadb-11.4-${ENGINE_COPY_RUNTIME_VERSION:-${DUNCKOPS_VERSION}}
    profiles: [tools]
